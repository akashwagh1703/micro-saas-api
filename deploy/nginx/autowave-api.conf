# Nginx reverse proxy for api.autowave.playltp.in → NestJS on port 3000
# Install: sudo cp deploy/nginx/autowave-api.conf /etc/nginx/sites-available/autowave-api
#          sudo ln -sf /etc/nginx/sites-available/autowave-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# CORS headers are set by NestJS — nginx only proxies.
# If the browser shows "CORS error" on upload AND status 413, the real problem is
# client_max_body_size (nginx rejected the file before Nest could add CORS headers).
# Fix: ensure client_max_body_size is set (below) then: sudo nginx -t && sudo systemctl reload nginx
# Or run: bash scripts/fix-upload-body-size.sh

server {
    listen 80;
    listen 443 ssl http2;
    server_name api.autowave.playltp.in;

    # ssl_certificate /etc/letsencrypt/live/api.autowave.playltp.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.autowave.playltp.in/privkey.pem;

    # Catalog logos/gallery can be several MB. Default nginx is 1m → 413 + fake CORS errors.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Large multipart uploads (catalog media)
        proxy_request_buffering on;
        client_max_body_size 25m;
    }
}
