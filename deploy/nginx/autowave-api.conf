# Nginx reverse proxy for api.autowave.playltp.in → NestJS on port 3000
# Install: sudo cp deploy/nginx/autowave-api.conf /etc/nginx/sites-available/autowave-api
#          sudo ln -sf /etc/nginx/sites-available/autowave-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# CORS headers are set by NestJS — nginx only proxies. If you see browser "CORS error"
# but this file is correct, the API process is down (502) — run: bash scripts/diagnose-server.sh

server {
    listen 80;
    listen 443 ssl http2;
    server_name api.autowave.playltp.in;

    # ssl_certificate /etc/letsencrypt/live/api.autowave.playltp.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.autowave.playltp.in/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
