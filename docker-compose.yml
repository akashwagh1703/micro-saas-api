# Local development stack: PostgreSQL + MinIO + the API (with in-process queue worker).
# Usage:
#   docker compose up --build
#   docker compose exec api npx prisma migrate deploy
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_automation
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/workflow_automation?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/workflow_automation?schema=public
      QUEUE_DRIVER: pgboss
      APP_ENCRYPTION_KEY: "local-development-key-change-me"
      BCRYPT_ROUNDS: "12"
      WHATSAPP_GRAPH_VERSION: v21.0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_FORCE_PATH_STYLE: "true"
      MINIO_BUCKET: autowave-career-resumes
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "3000:3000"

volumes:
  db_data:
  minio_data:
