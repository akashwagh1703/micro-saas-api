# Render Blueprint: one free web service (Docker).
# The web instance serves the API and runs the pg-boss queue worker in-process,
# so there is no separate worker service and no Redis required.
# DATABASE_URL/DIRECT_URL point to an externally-created Render Postgres (set in
# the dashboard), so this blueprint does not provision its own database.
services:
  - type: web
    name: micro-saas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: NODE_ENV
        value: production
      # 32-byte secret for encrypting WhatsApp/AI credentials. Render generates a
      # random value; CryptoService derives a 32-byte key from it.
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: WHATSAPP_GRAPH_VERSION
        value: v21.0
      - key: QUEUE_DRIVER
        value: pgboss
      # Set these in the Render dashboard to the managed Postgres connection string
      # (use the INTERNAL URL so the API talks to the DB over Render's private network).
      # Render Postgres is not pooled, so DIRECT_URL is the same string.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Set this to your deployed URL after the first deploy (used for webhook_url).
      - key: APP_URL
        sync: false
