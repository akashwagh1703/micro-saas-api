# Render Blueprint — Node web service (matches typical Render dashboard setup).
# If you use Docker instead, switch runtime to docker and dockerfilePath: ./Dockerfile
services:
  - type: web
    name: micro-saas-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && npx prisma migrate deploy
    startCommand: npm run start:render
    healthCheckPath: /up
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: WHATSAPP_GRAPH_VERSION
        value: v21.0
      - key: QUEUE_DRIVER
        value: pgboss
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: APP_URL
        sync: false
